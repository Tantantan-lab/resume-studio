name: Feature request
description: 提一个功能或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
  - type: checkboxes
    id: constraints
    attributes:
      label: 约束
      options:
        - label: 这是一个本地优先/静态功能（不依赖后端）
        - label: 涉及联网 AI（需要单独说明 API 和隐私）
