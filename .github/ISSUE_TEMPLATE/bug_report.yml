name: Bug report
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么？期望是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 看到 ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: macOS 15 / Chrome x / Node 20
  - type: textarea
    id: extra
    attributes:
      label: 截图或日志
      description: 请勿包含真实手机号、邮箱、照片等隐私信息。
